name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and typecheck
        run: |
          npm run test
          npm run typecheck

      # Signing is optional: with no MAC_CSC_LINK secret the build proceeds
      # unsigned (ad-hoc) and users install with --no-quarantine. Adding the
      # Developer ID cert + Apple credentials later flips on signing AND
      # notarization with no other changes.
      - name: Configure signing (when secrets are present)
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            {
              echo "CSC_LINK=${{ secrets.MAC_CSC_LINK }}"
              echo "CSC_KEY_PASSWORD=${{ secrets.MAC_CSC_KEY_PASSWORD }}"
              echo "APPLE_ID=${{ secrets.APPLE_ID }}"
              echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
              echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
            } >> "$GITHUB_ENV"
            echo "Signing + notarization enabled."
          else
            echo "No signing secrets — building unsigned (install with --no-quarantine)."
          fi

      # Builds but publishes nothing: the release is created further down, only
      # after the notarization tripwire has passed. `--publish always` used to
      # upload here, which put a broken build in front of users before the
      # tripwire could fail the run, and let electron-builder's per-artifact
      # publishers race each other to create the release (see below).
      - name: Build
        run: |
          npx electron-vite build
          npx electron-builder --config electron-builder.yml --mac --publish never

      # Tripwire: when signing is configured, a release that somehow built
      # unsigned or un-notarized (expired cert, mistyped secret, notary
      # outage) must fail the workflow instead of shipping quietly.
      # Gated on env (set by "Configure signing" when the secret exists) —
      # the secrets context is not allowed in `if` conditionals.
      - name: Verify signature and notarization
        if: env.CSC_LINK != ''
        run: |
          set -euo pipefail
          APP=$(find dist -maxdepth 2 -name '*.app' | head -1)
          echo "Verifying: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl -a -t exec -vv "$APP" 2>&1 | tee /tmp/spctl.out
          grep -q "Notarized Developer ID" /tmp/spctl.out

      # Nothing is published until the tripwire above has passed, so a build
      # that failed signing or notarization never becomes a visible release.
      #
      # Uploading explicitly also settles an electron-builder bug: it runs one
      # GitHub publisher per artifact, concurrently, and with no release for the
      # tag each one independently concludes "release doesn't exist" and creates
      # its own. The tag ends up with two releases and the assets split between
      # them, and /releases/download/<tag>/ resolves to only one. v0.4.1 lost
      # that coin flip — the DMG became unreachable and the Homebrew cask 404'd.
      #
      # Re-runnable: an existing release is uploaded into rather than recreated.
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="dist/Pandoras-Gate-${VERSION}-arm64.dmg"

          # The DMG is the release; anything else is optional update metadata
          # that only electron-updater consumes.
          if [ ! -f "$DMG" ]; then
            echo "Expected $DMG, found:"
            ls -1 dist || true
            exit 1
          fi

          ASSETS=("$DMG")
          for extra in "${DMG}.blockmap" dist/latest-mac.yml; do
            if [ -f "$extra" ]; then
              ASSETS+=("$extra")
            fi
          done
          echo "Publishing ${#ASSETS[@]} asset(s): ${ASSETS[*]}"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists — uploading into it."
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$VERSION" \
              --generate-notes \
              "${ASSETS[@]}"
          fi

      # The cask lives in tdarwin/homebrew-tap, not here, because Homebrew only
      # resolves the `brew install tdarwin/tap/pandoras-gate` shorthand against
      # repos named homebrew-*. Reaching another repo needs a PAT — GITHUB_TOKEN
      # is scoped to this one. Forks without the secret skip the cask update
      # rather than failing the release; gated on env, since the secrets context
      # is not allowed in `if` conditionals.
      - name: Check for tap credentials
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$HOMEBREW_TAP_TOKEN" ]; then
            echo "TAP_UPDATE=1" >> "$GITHUB_ENV"
          else
            echo "No HOMEBREW_TAP_TOKEN — skipping the Homebrew cask update."
          fi

      - name: Check out the Homebrew tap
        if: env.TAP_UPDATE == '1'
        uses: actions/checkout@v7
        with:
          repository: tdarwin/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew cask
        if: env.TAP_UPDATE == '1'
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="../dist/Pandoras-Gate-${VERSION}-arm64.dmg"
          SHA=$(shasum -a 256 "$DMG" | cut -d' ' -f1)

          mkdir -p Casks
          cat > Casks/pandoras-gate.rb <<CASK
          cask "pandoras-gate" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/tdarwin/pandoras_gate/releases/download/v#{version}/Pandoras-Gate-#{version}-arm64.dmg"
            name "Pandora's Gate"
            desc "Novel-writing studio with local and remote AI assistance"
            homepage "https://github.com/tdarwin/pandoras_gate"

            depends_on arch: :arm64
            depends_on macos: :ventura

            app "Pandora's Gate.app"

            zap trash: [
              "~/Library/Application Support/pandoras-gate",
              "~/Library/Preferences/com.davintaddeo.pandorasgate.plist",
              "~/Library/Saved Application State/com.davintaddeo.pandorasgate.savedState",
            ]
          end
          CASK

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/pandoras-gate.rb
          git commit -m "cask: pandoras-gate ${VERSION}" || echo "cask unchanged"
          git push
