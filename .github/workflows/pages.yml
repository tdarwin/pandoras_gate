name: Deploy site

# Publishes site/ to GitHub Pages (pandorasgate.app). The path filter keeps
# unrelated pushes to main — including the automated cask bump at the end of a
# release — from redeploying the site for no reason.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue the newer one instead of cancelling, so the
# last commit to main is always what ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # No build step: site/ is hand-written HTML and CSS, uploaded as-is.
      # site/CNAME carries the custom domain.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
