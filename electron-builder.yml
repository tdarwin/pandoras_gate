appId: com.davintaddeo.pandorasgate
productName: Pandora's Gate
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  # The main process resolves `?asset` imports (the window/dock icon) to paths
  # under resources/, so the directory has to ship alongside out/.
  - resources/**
asarUnpack:
  - '**/node_modules/@node-llama-cpp/**'
  - '**/node_modules/node-llama-cpp/**'
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  # Apple Silicon only for now: the x64 build needs per-arch native llama.cpp
  # binaries that the release runner doesn't install. Revisit for Intel.
  target:
    - target: dmg
      arch: [arm64]
  artifactName: Pandoras-Gate-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarizes when APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID env
  # vars are present (CI secrets); skips quietly when they are not.
  notarize: true
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Pandoras-Gate-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: tdarwin
  repo: pandoras_gate
  # Retained so electron-builder generates update metadata and knows where the
  # app is distributed from. It no longer does the uploading: the workflow
  # builds with `--publish never` and creates the release itself, after the
  # notarization tripwire. electron-builder's publisher ran once per artifact
  # and the copies raced to create the release, splitting assets across two.
  releaseType: release
npmRebuild: false
